<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poked App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1E272C;
            color: #ECF0F1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #2C3E50;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: #ECF0F1;
            letter-spacing: 1px;
        }
        p {
            color: #95A5A6;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn-download {
            display: inline-block;
            background-color: #2ECC71;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-download:hover {
            background-color: #27AE60;
            transform: translateY(-2px);
        }
        .btn-download:active {
            transform: translateY(0);
        }
        .version {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #5D6D7E;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Corregimos la ruta para que busque tu archivo exacto -->
        <img src="pinchado.png.png" alt="Poked Logo" class="logo" translate="no">
        
        <h1 translate="no">Poked</h1>
        <p>Aplicación organizadora de tareas de escritorio</p>
        
        <!-- Y el enlace de descarga, para que baje tu archivo .pyw -->
        <a href="pinchado.pyw" download="poked.pyw" class="btn-download">Descargar App</a>
        
        <div class="version">Versión 2.5</div>
    </div>

</body>
</html>
